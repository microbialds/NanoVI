name: CI

on:
  push:
    branches: [main, dev, "feat/**", "fix/**", "roadmap/**"]
  pull_request:
    branches: [main, dev]

jobs:
  # ── 1. Python unit tests ────────────────────────────────────────────────────
  unit-tests:
    name: Python unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r containers/requirements.txt pytest pytest-cov

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=bin \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  # ── Version strings agree (manifest, CHANGELOG, images, Python) ────────────
  version-check:
    name: Version strings agree
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check nextflow.config, CHANGELOG.md, Dockerfile, Singularity.def, bin/_version.py and conf/base.config
        run: .github/scripts/check_versions.sh

  # ── 2. Nextflow integration tests ──────────────────────────────────────────
  integration-tests:
    name: Nextflow integration tests (nf-test)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=24.0.0"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1

      - name: Run nf-test (stub mode)
        run: nf-test test tests/main.nf.test --tag stub --verbose

  # ── 3. End-to-end test on the e2e fixture (real tools, Docker) ─────────────
  e2e-tests:
    name: End-to-end test (nf-test, Docker)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=24.0.0"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1

      # Build the Python image from this commit under the tag conf/base.config uses,
      # so the test runs the image this branch defines instead of pulling from GHCR
      - name: Build the Python image
        run: |
          IMAGE=$(grep -o "ghcr.io/microbialds/nanovi-python:[A-Za-z0-9._-]*" conf/base.config | sort -u)
          test "$(echo "$IMAGE" | wc -l)" -eq 1 || { echo "conf/base.config names more than one nanovi-python tag: $IMAGE"; exit 1; }
          docker build -t "$IMAGE" -f containers/Dockerfile containers/

      - name: Run nf-test (e2e, Docker)
        run: nf-test test tests/main.nf.test --tag e2e --verbose

  # ── 4. Docker container build & versioned push to GHCR ─────────────────────
  container-build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract semantic version from CHANGELOG.md
        id: version
        run: |
          # Reads the first versioned "## [X.Y.Z]" line (skips [Unreleased]); falls back to "1.0.0"
          VERSION=$(grep -m1 '^## \[[0-9]' CHANGELOG.md \
            | sed 's/## \[//;s/\].*//' \
            || echo "1.0.0")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building image tag: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: containers/
          file: containers/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanovi-python:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/nanovi-python:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
