name: CI

on:
  push:
    branches: [main, dev, "feat/**", "fix/**", "roadmap/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

jobs:
  # ── 1. Python unit tests ────────────────────────────────────────────────────
  unit-tests:
    name: Python unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The run report's packages too (F60); its PDF test needs typst and runs in the report image (e2e job)
      - name: Install Python dependencies
        run: pip install -r containers/requirements.txt -r tests/requirements-report.txt pytest pytest-cov

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=bin \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  # ── Version strings agree (manifest, CHANGELOG, images, Python) ────────────
  version-check:
    name: Version strings agree
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check nextflow.config, CHANGELOG.md, Dockerfile, Singularity.def, bin/_version.py and conf/base.config
        run: .github/scripts/check_versions.sh

  # ── 2. Nextflow integration tests ──────────────────────────────────────────
  integration-tests:
    name: Nextflow integration tests (nf-test)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=26.04.0"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1

      - name: Run nf-test (stub mode)
        run: nf-test test tests/main.nf.test --tag stub --verbose

  # ── 3. End-to-end test on the e2e fixture (real tools, Docker) ─────────────
  e2e-tests:
    name: End-to-end test (nf-test, Docker)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=26.04.0"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1

      # Build the Python image from this commit under the tag conf/base.config uses,
      # so the test runs the image this branch defines instead of pulling from GHCR
      - name: Find the Python image tag
        id: image
        run: |
          IMAGE=$(grep -o "ghcr.io/microbialds/nanovi-python:[A-Za-z0-9._-]*" conf/base.config | sort -u)
          test "$(echo "$IMAGE" | wc -l)" -eq 1 || { echo "conf/base.config names more than one nanovi-python tag: $IMAGE"; exit 1; }
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Python image
        uses: docker/build-push-action@v5
        with:
          context: containers/
          file: containers/Dockerfile
          load: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The run report (F60, D42) has its own image, built from this commit the same way
      - name: Find the report image tag
        id: report_image
        run: |
          IMAGE=$(grep -o "ghcr.io/microbialds/nanovi-report:[A-Za-z0-9._-]*" conf/base.config | sort -u)
          test "$(echo "$IMAGE" | wc -l)" -eq 1 || { echo "conf/base.config names more than one nanovi-report tag: $IMAGE"; exit 1; }
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build the report image
        uses: docker/build-push-action@v5
        with:
          context: containers/report/
          file: containers/report/Dockerfile
          load: true
          tags: ${{ steps.report_image.outputs.image }}
          cache-from: type=gha,scope=nanovi-report
          cache-to: type=gha,mode=max,scope=nanovi-report

      # pdfinfo and pdffonts for the report's e2e test
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Run nf-test (e2e, Docker)
        run: nf-test test tests/main.nf.test --tag e2e --verbose

      # The report's unit and render tests in its image, where typst and Inter are (the
      # unit-tests job skips the PDF); pytest goes into a folder outside the image
      - name: Report tests in the report image
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" -w /repo \
            ${{ steps.report_image.outputs.image }} bash -euo pipefail -c '
              python -m pip install -q --target /tmp/pt pytest
              PYTHONPATH=/tmp/pt python -m pytest -p no:cacheprovider -v tests/unit/test_report_model.py tests/unit/test_report_render.py'

  # ── 3b. End-to-end test with -profile conda ───────────────────────────────
  e2e-conda:
    name: End-to-end test (nf-test, conda)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ">=26.04.0"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1

      # Installs only the micromamba executable (no environment is given)
      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: "2.9.0-0"

      # Nextflow creates the environments from conf/base.config with micromamba
      - name: Use micromamba for Nextflow's conda environments
        run: |
          mkdir -p ~/.nextflow
          echo 'conda.useMicromamba = true' >> ~/.nextflow/config

      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Run nf-test (e2e, conda)
        env:
          NANOVI_E2E_PROFILE: conda
        run: nf-test test tests/main.nf.test --tag e2e --verbose

  # ── 4. Docker image build; pushed to GHCR only from main and v* tags ────────
  # A push to main publishes :main and :sha-<short>. A v<X.Y.Z> git tag publishes
  # :X.Y.Z and :latest, once: the job fails if the tag does not match the top
  # release in CHANGELOG.md or if :X.Y.Z already exists. Other events only build.
  # Both images, nanovi-python and the run report's nanovi-report (F60, D42), follow these rules.
  container-build:
    name: Build & push Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [version-check, unit-tests, integration-tests, e2e-tests, e2e-conda]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # scope: the build cache each image shares with its e2e build (buildkit is the default)
          - image: nanovi-python
            context: containers/
            scope: buildkit
          - image: nanovi-report
            context: containers/report/
            scope: nanovi-report
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Work out the image tags
        id: tags
        run: |
          # The top "## [X.Y.Z]" release in CHANGELOG.md ([Unreleased] is skipped); no fallback
          VERSION=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error file=CHANGELOG.md::No '## [X.Y.Z]' release heading found"
            exit 1
          fi
          PUSH=false
          case "$GITHUB_REF" in
            refs/tags/v*)
              if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
                echo "::error::Git tag $GITHUB_REF_NAME does not match the top release in CHANGELOG.md ($VERSION)"
                exit 1
              fi
              TAGS="$IMAGE:$VERSION,$IMAGE:latest"
              PUSH=true ;;
            refs/heads/main)
              TAGS="$IMAGE:main,$IMAGE:sha-${GITHUB_SHA::7}"
              PUSH=true ;;
            *)
              TAGS="$IMAGE:sha-${GITHUB_SHA::7}" ;;
          esac
          { echo "version=$VERSION"; echo "tags=$TAGS"; echo "push=$PUSH"; } >> "$GITHUB_OUTPUT"
          echo "Image tags: $TAGS (push: $PUSH)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a released image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          REF="$IMAGE:${{ steps.tags.outputs.version }}"
          if OUT=$(docker manifest inspect "$REF" 2>&1); then
            echo "::error::$REF already exists; release a new version instead of overwriting it"
            exit 1
          elif ! echo "$OUT" | grep -qi "no such manifest\|manifest unknown\|not found"; then
            echo "::error::Could not check whether $REF exists: $OUT"
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}Dockerfile
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
